<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>react-countdown-clock</title>
  <style>
    body {
      background-color: #CCC;
    }
    #parappa { 
      position: absolute;
      top: 50%;
      left: 50%;
      width: 300px;
      height: 300px;
      margin: -150px 0 0 -150px;
    }
  </style>
</head>
<body>
  <div id="parappa"></div>
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "prop-types": "https://esm.sh/prop-types@15.8.1"
      }
    }
  </script>
  <script type="module">
    import React from 'react';
    import { createRoot } from 'react-dom/client';
    import ReactCountdownClock from './build/index.esm.js';

    const MAX = 120;
    const MIN = 10;

    const randomAmountOfSeconds = () => {
      return Math.floor( Math.random() * ( MAX - MIN + 1) + MIN )
    }

    const randomColor = () => {
      return `#${( Math.random() * 0xFFFFFF << 0 ).toString(16).padStart(6, '0')}`;
    }

    const Demo = () => {
      const [seconds, setSeconds] = React.useState(randomAmountOfSeconds);
      const [color, setColor] = React.useState(randomColor);
      const [paused, setPaused] = React.useState(false);
      const [fontSize, setFontSize] = React.useState('auto');

      const handleOnComplete = () => {
        setSeconds(randomAmountOfSeconds());
        setColor(randomColor());
        setPaused(false);
        setFontSize('auto');
      };

      const handleOnClick = () => {
        setPaused((prev) => {
          if (!prev) {
            setFontSize('45px');
          } else {
            setFontSize('auto');
          }
          return !prev;
        });
      };

      return React.createElement(ReactCountdownClock, {
        seconds,
        color,
        paused,
        pausedText: "▐▐ ",
        alpha: 0.9,
        onComplete: handleOnComplete,
        onClick: handleOnClick,
        fontSize
      });
    };

    const root = createRoot(document.getElementById('parappa'));
    root.render(React.createElement(Demo, null));
  </script>
</body>
</html>
